  :root { --paper:#fffaf2; --paper2:#f5ede0; --ink:#1d1a14; --ink60:rgba(29,26,20,.6); --ink40:rgba(29,26,20,.4); --ink15:rgba(29,26,20,.15); --ink08:rgba(29,26,20,.08); --green:#2f5b3a; --amber:#c7973d; --berry:#9a3a25; --moss:#5a8a5a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#d9d4cb; color:var(--ink); }
  .layout { display:flex; gap:24px; padding:24px 24px 90px; align-items:flex-start; justify-content:center; flex-wrap:wrap; }
  .panel { width:340px; background:#fff; border-radius:12px; padding:16px; font-size:13px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .panel h4 { margin:14px 0 6px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:#777; }
  .panel h4:first-child { margin-top:0; }
  .panel button { font:inherit; font-size:12px; border:1px solid #ccc; background:#f6f6f6; border-radius:14px; padding:4px 10px; margin:0 4px 4px 0; cursor:pointer; }
  .panel button.on { background:#222; color:#fff; border-color:#222; }
  .panel .note { color:#555; line-height:1.45; }
  .state { font-family:ui-monospace,Menlo,monospace; font-size:11px; background:#f4f4f4; border-radius:8px; padding:8px; white-space:pre-wrap; word-break:break-all; }
  /* the viewport being designed */
  .device { background:var(--paper); overflow:hidden; position:relative; box-shadow:0 8px 30px rgba(0,0,0,.18); }
  .device.phone { width:390px; min-height:780px; border-radius:36px; border:10px solid #111; }
  .device.desktop { width:1040px; min-height:680px; border-radius:10px; border-top:28px solid #e3e0da; }
  .display { font-family:Foglihten, Georgia, serif; font-weight:normal; }
  .muted { color:var(--ink60); }
  a { color:var(--green); }
  .stores { display:flex; gap:10px; flex-wrap:wrap; }
  .store { display:flex; align-items:center; gap:8px; background:var(--ink); color:var(--paper); border-radius:10px; padding:9px 14px; text-decoration:none; min-width:150px; }
  .store small { display:block; font-size:10px; opacity:.75; }
  .store b { display:block; font-size:16px; font-weight:600; }
  .store .g { font-size:22px; width:24px; text-align:center; }
  .store.secondary { background:transparent; color:var(--ink); border:1.5px solid var(--ink15); }
  .langs { font-size:12px; }
  .langs a { color:var(--ink60); text-decoration:none; }
  .langs a.on { color:var(--ink); font-weight:600; }
  .brand { display:flex; align-items:center; gap:8px; }
  .brand img { width:28px; height:28px; border-radius:7px; }
  .brand span { font-family:Foglihten, Georgia, serif; font-size:22px; }
  .garland { display:block; width:100%; height:44px; }
  .chip { display:inline-block; background:var(--paper2); border-radius:12px; padding:3px 10px; font-size:12px; }
  .openapp { font-size:13px; }
  /* A — the invitation card */
  .A { padding:28px 20px 40px; display:flex; flex-direction:column; align-items:center; }
  .A .top { width:100%; display:flex; justify-content:space-between; align-items:center; }
  .A .card { margin-top:26px; width:100%; max-width:440px; background:#fff; border-radius:18px; border:1px solid var(--ink08); box-shadow:0 10px 30px rgba(29,26,20,.08); padding:0 26px 28px; text-align:center; }
  .A .card .garland { margin:0 -26px; width:calc(100% + 52px); }
  .A .eyebrow { margin-top:14px; font-size:15px; }
  .A h1 { font-size:46px; line-height:1.05; margin:10px 0 12px; color:var(--green); overflow-wrap:anywhere; }
  .A .rule { height:1px; background:var(--ink08); margin:22px 0; }
  .A .stores { justify-content:center; }
  .A .after { font-size:13px; margin-top:14px; }
  .A .what { max-width:440px; text-align:center; font-size:13px; margin-top:22px; line-height:1.5; }
  /* B — the event cover, app-like, with steps */
  .B .cover { height:300px; position:relative; display:flex; flex-direction:column; justify-content:flex-end; padding:20px; color:#fff; background-size:cover; background-position:center; }
  .B .cover::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 30%, rgba(0,0,0,.6)); }
  .B .cover > * { position:relative; z-index:1; }
  .B .cover .brandbar { position:absolute; top:16px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:center; z-index:1; }
  .B .cover .brandbar .brand span, .B .cover .brandbar .langs a { color:#fff; }
  .B .cover h1 { font-size:40px; line-height:1.05; margin:4px 0 6px; overflow-wrap:anywhere; }
  .B .sheet { background:var(--paper); border-radius:22px 22px 0 0; margin-top:-18px; position:relative; z-index:2; padding:22px 22px 32px; }
  .B .inviter { display:flex; align-items:center; gap:12px; }
  .B .av { width:44px; height:44px; border-radius:22px; background:var(--amber); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; }
  .B ol { list-style:none; padding:0; margin:22px 0 0; counter-reset:s; }
  .B li { counter-increment:s; display:flex; gap:14px; padding:12px 0; border-top:1px solid var(--ink08); }
  .B li::before { content:counter(s); flex:none; width:28px; height:28px; border-radius:14px; background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:14px; }
  .B li .t { font-weight:600; }
  .B li .d { font-size:13px; margin-top:3px; }
  .B li .stores { margin-top:10px; }
  .B .desktopwrap { display:flex; }
  .B .desktopwrap .cover { flex:1; height:auto; min-height:652px; }
  .B .desktopwrap .sheet { width:440px; margin:0; border-radius:0; padding:40px 36px; }
  /* C — explain the app first, invite as a ribbon; QR on desktop */
  .C .ribbon { background:var(--green); color:var(--paper); padding:12px 20px; font-size:14px; display:flex; align-items:center; gap:10px; }
  .C .ribbon b { color:#fff; }
  .C .ribbon .dot { width:8px; height:8px; border-radius:4px; background:var(--amber); flex:none; }
  .C .body { padding:26px 22px 36px; }
  .C .head { display:flex; justify-content:space-between; align-items:center; }
  .C h1 { font-size:52px; line-height:1; margin:26px 0 10px; }
  .C .lede { font-size:17px; line-height:1.45; margin:0 0 20px; }
  .C .feats { display:grid; gap:10px; margin:0 0 24px; }
  .C .feat { display:flex; gap:12px; align-items:flex-start; background:#fff; border:1px solid var(--ink08); border-radius:12px; padding:12px; font-size:14px; line-height:1.4; }
  .C .feat .i { font-size:20px; }
  .C .desk { display:grid; grid-template-columns:1fr 300px; gap:48px; padding:40px 56px; }
  .C .qr { background:#fff; border:1px solid var(--ink08); border-radius:16px; padding:20px; text-align:center; font-size:13px; }
  .C .qr svg { width:200px; height:200px; }
  /* invalid */
  .invalid { padding:28px 22px; text-align:center; }
  .invalid .glyph { font-size:54px; margin:60px 0 6px; }
  .invalid h1 { font-size:38px; margin:6px 0 10px; }
  .invalid p { max-width:360px; margin:0 auto 10px; line-height:1.5; }
  /* OG previews */
  .og { border-radius:10px; overflow:hidden; background:#fff; border:1px solid #ddd; margin-bottom:10px; }
  .og .img { height:170px; position:relative; }
  .og .meta { padding:8px 10px; }
  .og .host { font-size:11px; color:#888; text-transform:uppercase; }
  .og .t { font-weight:600; font-size:13px; margin-top:2px; }
  .og .d { font-size:12px; color:#555; margin-top:2px; }
  .og.wa { background:#dcf8c6; border-color:#c8e8b0; }
  .og.wa .img { height:130px; }
  .og.im { width:250px; }
  .ogcard { position:absolute; inset:0; background:var(--paper); display:flex; flex-direction:column; justify-content:center; padding:0 18px; }
  .ogcard .garland { position:absolute; top:0; left:0; height:30px; }
  .ogcard .who { font-size:12px; color:var(--ink60); margin-top:14px; }
  .ogcard .ttl { font-family:Foglihten, Georgia, serif; font-size:30px; color:var(--green); line-height:1; margin-top:4px; }
  .ogcard .ft { position:absolute; bottom:10px; right:14px; font-family:Foglihten, Georgia, serif; font-size:15px; }
  .switcher { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:#ff2d7a; color:#fff; border-radius:24px; display:flex; align-items:center; padding:6px; font:600 14px -apple-system,sans-serif; box-shadow:0 6px 20px rgba(0,0,0,.25); z-index:99; }
  .switcher button { background:rgba(255,255,255,.2); border:0; color:#fff; width:34px; height:34px; border-radius:17px; font-size:16px; cursor:pointer; }
  .switcher span { padding:0 12px; min-width:280px; text-align:center; }
</style>
</head>
<body>
<div class="layout">
  <div id="device"></div>
  <div class="panel" id="panel"></div>
</div>
<div class="switcher"><button id="prev">←</button><span id="vlabel"></span><button id="next">→</button></div>

function lang() {

function fmtDate(iso, l) {

}
function garland(h = 44) {
  const cols = ['#c7973d','#9a3a25','#2f5b3a','#c7973d','#9a3a25'];
  let bulbs = '';
  for (let i = 0; i < 13; i++) { const x = 20 + i * 30; const y = 12 + Math.sin(i / 12 * Math.PI) * 14; bulbs += `<line x1="${x}" y1="${y-2}" x2="${x}" y2="${y+3}" stroke="#1d1a14" stroke-width="1.5"/><ellipse cx="${x}" cy="${y+9}" rx="5" ry="7" fill="${cols[i%5]}"/>`; }

}

function fakeQR(seed) {
  let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => ((s = (s * 1103515245 + 12345) >>> 0) / 4294967296);
  let r = ''; const n = 25;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const finder = (x < 7 && y < 7) || (x >= n-7 && y < 7) || (x < 7 && y >= n-7);
    const on = finder ? ((x%(n-7)===0||x%(n-7)===6||y%(n-7)===0||y%(n-7)===6|| (x%(n-7)>=2&&x%(n-7)<=4&&y%(n-7)>=2&&y%(n-7)<=4)) && !(x>=7&&x<n-7)) : rnd() > .5;
    if (finder && x >= 7 && x < n-7) continue;
    if (on) r += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 27 27" fill="#1d1a14">${r}</svg>`;
}

function variantB(d, l) {
  const c = COPY[l];
  const bg = d.background ? BG[d.background] : 'var(--paper2)';
  const coverStyle = d.background ? `background:${bg}` : `background:${bg};color:var(--ink)`;
  const cover = `<div class="cover" style="${coverStyle}">
      <div class="brandbar">${brand()}${langs()}</div>
      <div style="opacity:.9">${fmtDate(d.date, l)}</div>
      <h1 class="display">${d.title}</h1>
    </div>`;
  const sheet = `<div class="sheet">
      <div class="inviter"><div class="av">${d.inviterName[0]}</div><div>${c.invitedYou(d.inviterName).replace(/ (to|do)$/, '')}</div></div>
      <ol>
        <li><div style="flex:1"><div class="t">${c.s1}</div><div class="d muted">${c.s1d}</div>${stores(l)}</div></li>
        <li><div><div class="t">${c.s2}</div><div class="d muted">${c.s2d}</div></div></li>
        <li><div><div class="t">${c.s3(d.title)}</div><div class="d muted">${c.s3d}</div></div></li>
      </ol>
      <div style="margin-top:14px">${openApp(l, d)}</div>
    </div>`;
  return `<div class="B">${device === 'desktop' ? `<div class="desktopwrap">${cover}${sheet}</div>` : cover + sheet}</div>`;
}
function variantC(d, l) {
  const c = COPY[l];
  const ribbon = `<div class="ribbon"><span class="dot"></span><span>${c.ribbon(d.inviterName, d.title)} · ${fmtDate(d.date, l)}</span></div>`;
  const pitch = `<h1 class="display">Prezentowo</h1>
      <p class="lede">${c.lede}</p>
      <div class="feats">${c.feats.map(([i,t]) => `<div class="feat"><span class="i">${i}</span><span>${t}</span></div>`).join('')}</div>`;
  if (device === 'desktop') {
    return `<div class="C">${ribbon}<div style="padding:18px 56px 0;display:flex;justify-content:space-between">${brand()}${langs()}</div>
      <div class="desk"><div>${pitch}${openApp(l, d)}</div>
      <div class="qr">${fakeQR(d.code)}<p>${c.scan}</p><p class="muted">${c.orStores}</p>${stores(l)}</div></div></div>`;
  }
  return `<div class="C">${ribbon}<div class="body">
      <div class="head">${brand()}${langs()}</div>
      ${pitch}
      ${stores(l)}
      <div class="muted" style="font-size:13px;margin-top:12px">${c.after}</div>
      <div style="margin-top:10px">${openApp(l, d)}</div>
    </div></div>`;
}
function invalidPage(l) {
  const c = COPY[l];
  return `<div class="invalid">
    <div style="display:flex;justify-content:space-between">${brand()}${langs()}</div>
    <div class="glyph">🔗</div>
    <h1 class="display">${c.bad}</h1>
    <p>${c.badP}</p>
    <p class="muted" style="margin-top:26px">${c.badSub}</p>
    <div style="display:flex;justify-content:center;margin-top:12px">${stores(l)}</div>
  </div>`;
}

function ogImageHTML(d) {
  const ol = ogLang(), c = COPY[ol];
  if (!d || ogImage === 'brand' || (ogImage === 'cover' && !d.background)) {
    return `<div class="ogcard">${garland(30)}<div style="display:flex;align-items:center;gap:10px;margin-top:10px"><img src="${ICON}" style="width:44px;height:44px;border-radius:10px"><span class="display" style="font-size:34px">Prezentowo</span></div></div>`;
  }
  if (ogImage === 'cover') return `<div class="ogcard" style="background:${BG[d.background]}"></div>`;
  return `<div class="ogcard">${garland(30)}<div class="who">${c.ogWho(d.inviterName)}</div><div class="ttl">${d.title}</div><div class="ft">Prezentowo</div></div>`;
}
function ogPreviews(d) {
  const c = COPY[ogLang()];
  const t = d ? c.ogT(d.inviterName, d.title) : c.ogBadT;
  const desc = d ? c.ogD : c.ogBadD;
  const url = `prezentowo.pl/e/${d ? d.code : 'x7k2'}`;
  return `
    <div class="og"><div class="img">${ogImageHTML(d)}</div><div class="meta"><div class="host">prezentowo.pl</div><div class="t">${t}</div><div class="d">${desc}</div></div></div>
    <div style="font-size:11px;color:#888;margin:-6px 0 10px">↑ Messenger / Slack-style</div>
    <div class="og wa"><div class="img">${ogImageHTML(d)}</div><div class="meta"><div class="t">${t}</div><div class="d">${desc}</div><div class="host" style="text-transform:none">${url}</div></div></div>
    <div style="font-size:11px;color:#888;margin:-6px 0 10px">↑ WhatsApp-style</div>`;
}

function btns(map, cur, attr) { return Object.entries(map).map(([k,v]) => `<button data-${attr}="${k}" class="${k===cur?'on':''}">${typeof v === 'string' ? v : v.label}</button>`).join(''); }
function render() {
  const d = SCENARIOS[scenario].data, l = lang();
  const dev = document.getElementById('device');
  dev.className = `device ${device}`;
  dev.innerHTML = d ? ({ A:variantA, B:variantB, C:variantC })[variant](d, l) : invalidPage(l);
  document.getElementById('vlabel').textContent = `${variant} — ${VARIANTS[variant]}`;
  document.getElementById('panel').innerHTML = `
    <h4>Scenario</h4>${btns(Object.fromEntries(Object.entries(SCENARIOS).map(([k,v]) => [k, v.label])), scenario, 'sc')}
    <div class="note">${SCENARIOS[scenario].note}</div>
    <h4>Device</h4>${btns({ phone:'Phone', desktop:'Desktop' }, device, 'dev')} ${device === 'phone' ? btns({ ios:'iOS', android:'Android' }, os, 'os') : ''}
    <h4>Language rule</h4>${btns(LANG_RULES, langRule, 'lr')}
    <div class="note">${LANG_RULES[langRule].note}</div>
    ${langRule === 'accept' ? `<div style="margin-top:6px">Browser sends: ${btns({ pl:'pl', en:'en', de:'de' }, browserLang, 'bl')}</div>` : ''}
    <h4>OG image</h4>${btns(OG_IMAGES, ogImage, 'og')}
    <div class="note">${OG_IMAGES[ogImage].note}</div>
    <h4>Link preview (OG copy is pl — crawlers send no useful Accept-Language)</h4>
    ${ogPreviews(d)}
    <h4>State</h4>
    <div class="state">${JSON.stringify({ variant, scenario, device, os: device === 'phone' ? os : null, lang: l, langOverride, invitePreview: d }, null, 1)}</div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-sc],[data-dev],[data-os],[data-lr],[data-bl],[data-og],[data-lang]');
  if (!t) return;
  e.preventDefault();
  if (t.dataset.sc) scenario = t.dataset.sc;
  if (t.dataset.dev) device = t.dataset.dev;
  if (t.dataset.os) os = t.dataset.os;
  if (t.dataset.lr) { langRule = t.dataset.lr; langOverride = null; }
  if (t.dataset.bl) { browserLang = t.dataset.bl; langOverride = null; }
  if (t.dataset.og) ogImage = t.dataset.og;
  if (t.dataset.lang) langOverride = t.dataset.lang;
  render();
});
function setVariant(v) { variant = v; history.replaceState(null, '', `?variant=${v}`); render(); }
const keys = Object.keys(VARIANTS);
const step = n => setVariant(keys[(keys.indexOf(variant) + n + keys.length) % keys.length]);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea,[contenteditable]')) return; if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1); });
render();
</script>
</body>
</html>
