  :root {
    --paper:#fffaf2; --paper2:#f5ede0; --ink:#1d1a14; --ink60:rgba(29,26,20,.6);

  * { box-sizing:border-box; }
  body { margin:0; background:#e9e4da; font:14px/1.35 -apple-system, system-ui, sans-serif; color:var(--ink); padding:16px 16px 90px; }
  .controls { max-width:780px; margin:0 auto 14px; display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .controls b { font-size:12px; color:#555; margin-right:4px; }
  .controls button { font:inherit; font-size:12px; padding:6px 10px; border-radius:6px; border:1px solid #bbb; background:#fff; cursor:pointer; }
  .controls button.on { background:#222; color:#fff; border-color:#222; }
  .note { max-width:780px; margin:0 auto 14px; font-size:12px; color:#555; }
  .stage { display:flex; gap:24px; justify-content:center; flex-wrap:wrap; }
  .phone { width:360px; height:720px; background:var(--paper); border-radius:36px; border:10px solid #111; position:relative; overflow:hidden; display:flex; flex-direction:column; }
  .cap { text-align:center; font-size:11px; color:#666; margin-top:6px; }
  .status { height:28px; flex:none; display:flex; justify-content:space-between; padding:6px 20px 0; font-size:11px; font-weight:600; }
  .hdr { flex:none; display:flex; align-items:center; gap:10px; padding:8px 16px 10px; }
  .hdr .t { font-family:Foglihten, Georgia, serif; font-size:26px; line-height:1; flex:1; }
  .hdr .sub { font-size:11px; color:var(--ink60); font-family:system-ui; }
  .icon { width:32px; height:32px; border-radius:16px; display:grid; place-items:center; font-size:16px; }
  .icon.dis { opacity:.3; }
  .scroll { flex:1; overflow:auto; position:relative; }
  .group { padding:14px 18px 4px; font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--ink40); }
  .group small { display:block; text-transform:none; letter-spacing:0; font-weight:500; }
  .row { display:flex; align-items:center; gap:12px; padding:11px 18px; border-bottom:1px solid var(--ink08); position:relative; cursor:pointer; }
  .tile { width:52px; height:52px; border-radius:12px; background:var(--paper2); display:grid; place-items:center; flex:none; position:relative; }
  .tile img { width:46px; height:46px; object-fit:contain; }
  .row .body { flex:1; min-width:0; }
  .row .title { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .meta { font-size:12px; color:var(--ink60); margin-top:3px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .chip { font-size:11px; padding:2px 7px; border-radius:10px; background:var(--ink08); white-space:nowrap; }
  .chip.me { background:rgba(47,91,58,.14); color:var(--green); font-weight:600; }
  .recap { margin:12px 16px 4px; padding:10px 12px; border-radius:12px; background:var(--paper2); display:flex; justify-content:space-between; align-items:center; font-size:12px; color:var(--ink60); }
  .recap span.btn { background:var(--ink); color:var(--paper); padding:5px 10px; border-radius:14px; font-weight:600; }
  .fab { position:absolute; right:18px; bottom:22px; width:52px; height:52px; border-radius:26px; background:var(--green); color:#fff; display:grid; place-items:center; font-size:26px; box-shadow:0 4px 10px rgba(0,0,0,.2); }
  .photo { margin:4px 16px 0; height:220px; border-radius:18px; background:var(--paper2); display:grid; place-items:center; }
  .photo img { width:170px; }
  .dsec { padding:12px 18px 0; }
  .dsec .lbl { font-size:11px; font-weight:700; color:var(--ink40); text-transform:uppercase; letter-spacing:.04em; margin-bottom:5px; }
  .cta { margin:18px 16px; padding:14px; border-radius:14px; background:var(--green); color:#fff; text-align:center; font-weight:700; cursor:pointer; }
  .cta.ghost { background:transparent; color:var(--green); border:1.5px solid var(--green); }
  .linkbtn { color:var(--berry); font-weight:700; font-size:12px; cursor:pointer; text-decoration:underline; }

  /* ---------- Variant A: strip + in-place dim ---------- */
  .A-strip { flex:none; background:var(--ink); color:var(--paper); font-size:12px; padding:7px 16px; display:flex; gap:8px; align-items:center; }
  .A-strip .dot { width:7px; height:7px; border-radius:4px; background:var(--amber); }
  .A-pending { opacity:.55; }
  .A-pending .tile { outline:1.5px dashed var(--ink40); outline-offset:-1.5px; }
  .A-pendnote { color:var(--amber); font-weight:600; font-size:11px; }
  .A-failed { background:rgba(154,58,37,.06); box-shadow:inset 3px 0 0 var(--berry); }
  .A-failnote { color:var(--berry); font-weight:600; font-size:11px; }
  .chip.dash { background:transparent; border:1px dashed var(--green); color:var(--green); }
  .chip.bad { background:transparent; border:1px solid var(--berry); color:var(--berry); text-decoration:line-through; }

  /* ---------- Variant B: floating pill + outbox sheet ---------- */
  .B-pill { position:absolute; left:50%; transform:translateX(-50%); bottom:24px; background:var(--ink); color:var(--paper); border-radius:20px; padding:9px 14px; font-size:12px; font-weight:600; white-space:nowrap; box-shadow:0 4px 12px rgba(0,0,0,.25); cursor:pointer; display:flex; gap:8px; align-items:center; z-index:5; }
  .B-pill.bad { background:var(--berry); }
  .B-pill .n { background:var(--paper); color:var(--ink); border-radius:9px; padding:0 6px; font-size:11px; }
  .B-badge { position:absolute; right:-5px; top:-5px; width:18px; height:18px; border-radius:9px; background:var(--amber); color:#fff; font-size:10px; display:grid; place-items:center; border:2px solid var(--paper); }
  .B-badge.bad { background:var(--berry); }
  .B-scrim { position:absolute; inset:0; background:rgba(0,0,0,.35); z-index:8; }
  .B-sheet { position:absolute; left:0; right:0; bottom:0; background:var(--paper); border-radius:22px 22px 0 0; z-index:9; padding:10px 0 24px; }
  .B-sheet .grab { width:40px; height:4px; background:var(--ink15); border-radius:2px; margin:0 auto 10px; }
  .B-sheet h3 { margin:0 18px 2px; font-family:Foglihten, Georgia, serif; font-weight:400; font-size:24px; }
  .B-sheet p { margin:0 18px 8px; font-size:12px; color:var(--ink60); }

  /* ---------- Variant C: header state + "waiting to send" card ---------- */
  .C-hdr-off { background:repeating-linear-gradient(-45deg, var(--paper2) 0 8px, #efe5d4 8px 16px); }
  .C-box { margin:12px 16px 4px; border:1.5px dashed var(--amber); border-radius:14px; overflow:hidden; }
  .C-box.bad { border-color:var(--berry); border-style:solid; }
  .C-box .bh { padding:8px 12px; font-size:12px; font-weight:700; color:var(--amber); display:flex; justify-content:space-between; }
  .C-box.bad .bh { color:var(--berry); }
  .C-box .row { padding:9px 12px; }
  .C-box .row:last-child { border-bottom:0; }
  .C-ghost { opacity:.35; }
  .C-ctaoff { margin:18px 16px; padding:12px; border-radius:14px; border:1.5px dashed var(--amber); font-size:12px; text-align:center; color:var(--ink60); }

  /* switcher (prototype chrome, not design) */
  .switcher { position:fixed; left:50%; bottom:16px; transform:translateX(-50%); background:#ff2d7a; color:#fff; border-radius:24px; display:flex; align-items:center; gap:4px; padding:4px; box-shadow:0 6px 18px rgba(0,0,0,.3); z-index:100; font:600 13px system-ui; }
  .switcher button { background:rgba(255,255,255,.2); border:0; color:#fff; width:34px; height:34px; border-radius:17px; font-size:16px; cursor:pointer; }
  .switcher span { padding:0 12px; min-width:220px; text-align:center; }
</style>
</head>

<div class="stage">
  <div><div class="phone" id="list"></div><div class="cap">3f — Ola's presents (someone else)</div></div>
  <div><div class="phone" id="detail"></div><div class="cap">1e — present detail</div></div>
</div>

const IMG = n => IMGS[n];
const VARIANTS = { A:'Strip + dim in place', B:'Floating pill + outbox sheet', C:'Header state + waiting card' };
const SCENARIOS = {
  online:   { label:'1 · Online', note:'Baseline. Nothing queued.' },
  offline:  { label:'2 · Offline, nothing queued', note:'Banner only — browsing the cached copy.' },
  pending:  { label:'3 · Offline, 2 queued', note:'You added "Bike bell" and claimed "Kindle" while offline. Try tapping "I\'ll buy this too" on another present.' },
  failed:   { label:'4 · Back online, 1 failed', note:'Replay ran: "Bike bell" synced, the claim on "Kindle" failed (present was removed while you were offline). Discard it.' },
  mixed:    { label:'5 · Offline again, 1 failed + 1 queued', note:'Edge: a failure from an earlier replay is still undismissed, and you are offline again with a new queued add.' },
};

let variant = new URLSearchParams(location.search).get('variant') || 'A';
if (!VARIANTS[variant]) variant = 'A';
let scenario = 'pending';
let state, selected, sheetOpen = false;

function baseGifts() {
  return [
    { id:'kindle', title:'Kindle Paperwhite', img:4, group:'own', addedBy:'Ola', buyers:['Tomek'], desc:'The one without ads, 16 GB.' },
    { id:'scarf', title:'Wool scarf, forest green', img:7, group:'own', addedBy:'Ola', buyers:[], desc:'Long, not itchy.' },
    { id:'lego', title:'LEGO Botanical — orchid', img:11, group:'others', addedBy:'Marta', buyers:['Marta','Tomek'], desc:'' },
    { id:'tea', title:'Tea sampler', img:2, group:'others', addedBy:'Tomek', buyers:[], desc:'Loose leaf, 12 kinds.' },
  ];
}
const bell = () => ({ id:'bell', title:'Bike bell, brass', img:15, group:'others', addedBy:'You', buyers:[], desc:'' });
const lamp = () => ({ id:'lamp', title:'Reading lamp', img:9, group:'others', addedBy:'You', buyers:[], desc:'' });

function load(s) {
  scenario = s; sheetOpen = false;
  const g = baseGifts();
  const byId = id => g.find(x => x.id === id);
  let online = true;
  if (s === 'offline') online = false;
  if (s === 'pending') { online = false; g.push({ ...bell(), sync:'pending' }); byId('kindle').claim = 'pending'; }
  if (s === 'failed')  { g.push({ ...bell() }); byId('kindle').claim = 'failed'; byId('kindle').why = 'This present was removed while you were offline.'; }
  if (s === 'mixed')   { online = false; byId('kindle').claim = 'failed'; byId('kindle').why = 'This present was removed while you were offline.'; g.push({ ...lamp(), sync:'pending' }); }
  state = { online, gifts:g };
  selected = 'kindle';
  render();
}

// ---- actions (stubbed; no backend) ----
function claim(id) {
  const x = state.gifts.find(g => g.id === id);
  if (state.online) { x.buyers = [...x.buyers, 'You']; } else { x.claim = 'pending'; }
  render();
}
function discard(id, kind) {
  const x = state.gifts.find(g => g.id === id);
  if (kind === 'add') state.gifts = state.gifts.filter(g => g.id !== id);
  else { delete x.claim; delete x.why; }
  render();
}
const queued = () => state.gifts.flatMap(g => [
  ...(g.sync ? [{ g, kind:'add', st:g.sync }] : []),
  ...(g.claim ? [{ g, kind:'claim', st:g.claim }] : []),
]);

// ---- shared pieces ----
const status = () => `<div class="status"><span>9:41</span><span>${state.online ? '􀙇 ▮▮▮' : '✈︎ ▮'}</span></div>`;
function buyerChips(g) {
  let h = g.buyers.map(b => `<span class="chip ${b==='You'?'me':''}">🛍 ${b}</span>`).join('');
  if (g.claim === 'pending' && (variant === 'A')) h += `<span class="chip dash">🛍 You · ⏱</span>`;
  if (g.claim === 'failed' && variant === 'A') h += `<span class="chip bad">🛍 You</span>`;
  return h;
}
function tile(g, badge='') { return `<div class="tile"><img src="${IMG(g.img)}">${badge}</div>`; }

// ---- 3f list ----
function renderList() {
  const own = state.gifts.filter(g => g.group === 'own');
  const oth = state.gifts.filter(g => g.group === 'others');
  const q = queued();
  const offline = !state.online;

  let hdrCls = '', hdrSub = '6 people · Christmas 2026';
  if (variant === 'C' && offline) { hdrCls = 'C-hdr-off'; hdrSub = '⚠︎ Offline · you\'re seeing the last saved copy'; }

  let top = '';
  if (variant === 'A' && offline) top = `<div class="A-strip"><span class="dot"></span>Offline — showing saved data${q.length ? ` · ${q.filter(x=>x.st==='pending').length} waiting to send` : ''}</div>`;

  let body = `<div class="recap"><span>💬 Tomek: I'll get the Kindle, OK?</span><span class="btn">Chat</span></div>`;

  if (variant === 'C' && q.length) body += cBox(q, false);

  const skip = g => variant === 'C' && g.sync; // C moves queued adds into the card
  body += `<div class="group">Ola's own wishes</div>` + own.filter(g=>!skip(g)).map(rowHtml).join('');
  body += `<div class="group">Suggested by others<small>Ola never sees this group — or any buyers</small></div>` + oth.filter(g=>!skip(g)).map(rowHtml).join('');
  body += `<div style="height:90px"></div>`;

  let overlay = '';
  if (variant === 'B') overlay = bPill(q) + (sheetOpen ? bSheet(q) : '');

  const fab = (variant === 'B' && (offline || q.length)) ? '' : `<div class="fab">＋</div>`;

  document.getElementById('list').innerHTML =
    status() + top +
    `<div class="hdr ${hdrCls}"><div class="icon">☰</div><div style="flex:1"><div class="t">Ola</div><div class="sub">${hdrSub}</div></div></div>` +
    `<div class="scroll">${body}</div>` + fab + overlay;
}

function rowHtml(g) {
  let cls = 'row', note = '', badge = '';
  if (variant === 'A') {
    if (g.sync === 'pending') { cls += ' A-pending'; note = `<span class="A-pendnote">⏱ Will add when back online</span>`; }
    if (g.claim === 'failed') { cls += ' A-failed'; note = `<span class="A-failnote">Couldn't save your claim</span> <span class="linkbtn" data-discard="${g.id}:claim">Discard</span>`; }
    if (g.claim === 'pending') note = `<span class="A-pendnote">⏱ Claim waiting to send</span>`;
  }
  if (variant === 'B') {
    if (g.sync === 'pending' || g.claim === 'pending') badge = `<div class="B-badge">⏱</div>`;
    if (g.claim === 'failed' || g.sync === 'failed') badge = `<div class="B-badge bad">!</div>`;
  }
  if (variant === 'C' && g.claim) note = `<span style="color:${g.claim==='failed'?'var(--berry)':'var(--amber)'};font-size:11px;font-weight:600">${g.claim==='failed'?'↑ see "couldn\'t send"':'↑ your claim is waiting'}</span>`;
  const by = g.group === 'others' ? `<span>by ${g.addedBy}</span>` : '';
  return `<div class="${cls}" data-open="${g.id}">${tile(g, badge)}<div class="body"><div class="title">${g.title}</div><div class="meta">${by}${buyerChips(g)}</div>${note ? `<div class="meta">${note}</div>` : ''}</div></div>`;
}

function bPill(q) {
  const pend = q.filter(x => x.st === 'pending').length, bad = q.filter(x => x.st === 'failed').length;
  if (state.online && !q.length) return '';
  if (bad) return `<div class="B-pill bad" data-sheet>! ${bad} change${bad>1?'s':''} couldn't be saved${!state.online?' · offline':''}<span class="n">›</span></div>`;
  return `<div class="B-pill" data-sheet>☁︎̸ Offline${pend ? ` <span class="n">${pend} waiting</span>` : ''}</div>`;
}
function bSheet(q) {
  const rows = q.map(({g,kind,st}) => `<div class="row">${tile(g)}<div class="body"><div class="title">${kind==='add'?'Add':'Claim'}: ${g.title}</div><div class="meta">${st==='pending'?'<span class="A-pendnote">⏱ Sends automatically when back online</span>':`<span class="A-failnote">${g.why||'Couldn\'t be saved'}</span>`}</div></div>${st==='failed'?`<span class="linkbtn" data-discard="${g.id}:${kind}">Discard</span>`:''}</div>`).join('');
  return `<div class="B-scrim" data-sheet></div><div class="B-sheet"><div class="grab"></div><h3>${state.online?'Online':'You\'re offline'}</h3><p>${state.online?'Everything else is saved.':'You can browse everything saved on this phone. Adding presents and claiming still work — they\'ll send when you\'re back.'}</p>${rows || '<p>Nothing waiting.</p>'}</div>`;
}
function cBox(q, compact) {
  const bad = q.some(x => x.st === 'failed');
  const rows = q.map(({g,kind,st}) => `<div class="row" data-open="${g.id}">${tile(g)}<div class="body"><div class="title">${kind==='add'?'':'Claim · '}${g.title}</div><div class="meta">${st==='pending'?(kind==='add'?`<span>for Ola · suggested by you</span>`:'<span>you\'re buying this</span>'):`<span class="A-failnote">${g.why||'Couldn\'t be saved'}</span>`}</div></div>${st==='failed'?`<span class="linkbtn" data-discard="${g.id}:${kind}">Discard</span>`:'<span style="font-size:16px;color:var(--amber)">⏱</span>'}</div>`).join('');
  const pend = q.filter(x=>x.st==='pending').length;
  const head = bad ? `<span>Couldn't send</span>` : `<span>Waiting to send · ${pend}</span><span style="font-weight:500;color:var(--ink60)">sends when online</span>`;
  return `<div class="C-box ${bad?'bad':''}"><div class="bh">${head}</div>${rows}</div>`;
}

// ---- 1e detail ----
function renderDetail() {
  const g = state.gifts.find(x => x.id === selected) || state.gifts[0];
  const offline = !state.online;
  const mine = g.buyers.includes('You');
  const q = queued().filter(x => x.g.id === g.id);

  let top = '';
  if (variant === 'A' && offline) top = `<div class="A-strip"><span class="dot"></span>Offline — showing saved data</div>`;
  let hdrCls = variant === 'C' && offline ? 'C-hdr-off' : '';

  let cta;
  if (mine) cta = `<div class="cta ghost">✓ You're buying this</div>`;
  else if (g.sync === 'pending') cta = `<div class="C-ctaoff">This present hasn't been sent yet — buying opens once it's added.</div>`;
  else if (g.claim === 'pending') {
    cta = variant === 'A' ? `<div class="cta ghost" style="border-style:dashed;opacity:.7">⏱ You'll be marked as buying when back online</div>`
        : variant === 'B' ? `<div class="cta ghost" style="position:relative">🛍 I'll buy this too <span class="B-badge" style="top:-7px;right:-7px">⏱</span></div>`
        : `<div class="C-ctaoff">⏱ <b>Your claim is waiting to send.</b><br>It goes through automatically when you're online.</div>`;
  } else if (g.claim === 'failed') {
    cta = variant === 'B' ? `<div class="cta" style="background:var(--berry)" data-sheet>! Your claim couldn't be saved ›</div>`
        : `<div class="C-ctaoff" style="border:1.5px solid var(--berry);color:var(--berry)"><b>Couldn't save your claim.</b><br>${g.why}<br><br><span class="linkbtn" data-discard="${g.id}:claim">Discard</span></div>`;
  } else cta = `<div class="cta" data-claim="${g.id}">🛍 I'll buy this too</div>`;

  let overlay = variant === 'B' ? bPill(queued()) + (sheetOpen ? bSheet(queued()) : '') : '';

  document.getElementById('detail').innerHTML =
    status() + top +
    `<div class="hdr ${hdrCls}"><div class="icon" data-back>←</div><div style="flex:1"></div><div class="icon ${offline?'dis':''}" title="${offline?'Needs a connection':''}">✎</div></div>` +
    `<div class="scroll"><div class="photo" style="${g.sync==='pending' && variant!=='B'?'opacity:.55;outline:1.5px dashed var(--ink40);outline-offset:-1.5px':''}"><img src="${IMG(g.img)}"></div>` +
    `<div class="dsec"><div class="t" style="font-family:Foglihten,Georgia,serif;font-size:28px">${g.title}</div></div>` +
    `<div class="dsec"><div class="lbl">For</div><span class="chip">Ola</span> <span style="font-size:12px;color:var(--ink60);margin-left:8px">added by ${g.addedBy}</span></div>` +
    `<div class="dsec"><div class="lbl">Buying</div><div class="meta" style="display:flex;gap:6px;flex-wrap:wrap">${buyerChips(g) || '<span style="font-size:12px;color:var(--ink40)">No one yet</span>'}</div></div>` +
    (g.desc ? `<div class="dsec"><div class="lbl">Description</div>${g.desc}</div>` : '') +
    cta + `<div style="height:80px"></div></div>` + overlay;
}

function render() {
  renderList(); renderDetail();
  document.getElementById('vlabel').textContent = `${variant} — ${VARIANTS[variant]}`;
  document.getElementById('controls').innerHTML = '<b>Scenario</b>' + Object.entries(SCENARIOS).map(([k,v]) => `<button data-sc="${k}" class="${k===scenario?'on':''}">${v.label}</button>`).join('') + `<button data-toggle>${state.online ? 'Go offline' : 'Go online (no replay)'}</button>`;
  document.getElementById('note').textContent = SCENARIOS[scenario].note + ' Tap any present to open it on the right.';
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-sc],[data-toggle],[data-open],[data-claim],[data-discard],[data-sheet]');
  if (!t) return;
  if (t.dataset.sc) return load(t.dataset.sc);
  if ('toggle' in t.dataset) { state.online = !state.online; return render(); }
  if (t.dataset.discard) { e.stopPropagation(); const [id, k] = t.dataset.discard.split(':'); return discard(id, k); }
  if ('sheet' in t.dataset) { sheetOpen = !sheetOpen; return render(); }
  if (t.dataset.claim) return claim(t.dataset.claim);
  if (t.dataset.open) { selected = t.dataset.open; return render(); }
});
function setVariant(v) { variant = v; history.replaceState(null, '', `?variant=${v}`); sheetOpen = false; render(); }
const keys = Object.keys(VARIANTS);
const step = d => setVariant(keys[(keys.indexOf(variant) + d + keys.length) % keys.length]);
document.getElementById('prev').onclick = () => step(-1);
document.getElementById('next').onclick = () => step(1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});
load('pending');
</script>
</body>
</html>
